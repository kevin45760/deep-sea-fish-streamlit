<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深海奇蹟 - Python 版本</title>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background: #0a1f3d; color: #e0f0ff; margin: 0; padding: 0; }
        header { background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), url('https://picsum.photos/id/1015/1920/600'); height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        h1 { font-size: 4rem; color: #00f5ff; text-shadow: 0 0 20px #00f5ff; }
        .container { max-width: 1100px; margin: 0 auto; padding: 40px; }
        .card { background: rgba(30,58,95,0.8); border-radius: 15px; padding: 25px; margin: 20px 0; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>🌊 深海奇蹟</h1>
            <p style="font-size: 1.8rem;">探索神秘的深海魚類</p>
        </div>
    </header>

    <div class="container">
        <h2 style="text-align:center; color:#00f5ff;">知名深海魚種</h2>
        
        <div class="card">
            <h3>🐟 燈籠魚 (Anglerfish)</h3>
            <p>利用頭頂發光釣竿吸引獵物，是最經典的深海魚。</p>
        </div>
        
        <div class="card">
            <h3>🐟 鮟鱇魚 (Blobfish)</h3>
            <p>在深海高壓下像果凍，外表「悲傷」但適應力極強。</p>
        </div>
        
        <div class="card">
            <h3>🦈 Goblin Shark</h3>
            <p>活化石級別的鯊魚，可伸出巨大下顎捕食。</p>
        </div>
    </div>

    <footer style="text-align:center; padding:40px; background:#000;">
        <p>由 Python Flask 驅動 • 深海魚類介紹網頁</p>
    </footer>
</body>
</html>
